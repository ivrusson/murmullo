    <rect x="22" y="38" width="8" height="24" rx="4" fill="url(#flowGrad)" />
    <rect x="36" y="24" width="8" height="52" rx="4" fill="url(#flowGrad)" />
    <rect x="50" y="16" width="8" height="68" rx="4" fill="url(#flowGrad)" />
    <rect x="64" y="28" width="8" height="44" rx="4" fill="url(#flowGrad)" />
    <rect x="78" y="42" width="8" height="16" rx="4" fill="url(#flowGrad)" />
  </g>
</svg>
