name: Auto Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'src-tauri/src/**'
  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Generate TypeScript documentation
        run: |
          echo "Generating TypeScript documentation..."
          # Add TypeScript documentation generation here
          # Example: typedoc

      - name: Generate Rust documentation
        run: |
          echo "Generating Rust documentation..."
          cd src-tauri && cargo doc --no-deps

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation-${{ github.run_number }}
          path: |
            docs/
            src-tauri/target/doc/
          retention-days: 30
