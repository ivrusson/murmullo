<!doctype html>
<html lang="es">
  <head>
    <style>
      /* Declare StyleX layers before the atomic CSS injects. */
      @layer theme, base, components, utilities, priority1, priority2, priority3, priority4, priority5;
    </style>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Murmullo</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('murmullo-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark =
            stored === 'dark' ||
            (stored === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
